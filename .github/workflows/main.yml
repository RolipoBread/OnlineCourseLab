name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # =========================
  # 1. BUILD
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile project
        run: mvn clean compile


  # =========================
  # 2. TESTS
  # =========================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn test


  # =========================
  # 3. DOCKER BUILD
  # =========================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t online-courses-app .


  # =========================
  # 4. DEPLOY (Render)
  # =========================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


  # =========================
  # 5. HEALTHCHECK
  # =========================
  healthcheck:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for startup
        run: sleep 60

      - name: Check app health
        run: |
          for i in {1..15}
          do
            echo "Attempt $i..."

            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://onlinecourselab.onrender.com)

            if [ "$RESPONSE" -eq 200 ]; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Not ready yet..."
            sleep 15
          done

          echo "Health check failed"
          exit 1