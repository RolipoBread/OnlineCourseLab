name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened]

jobs:
  # =========================
  # 1. СБОРКА (BUILD)
  # =========================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build project
        run: mvn clean compile -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-artifacts
          path: target/*.jar
          if-no-files-found: error

  # =========================
  # 2. ТЕСТЫ (TESTS) с PostgreSQL
  # =========================
  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: university
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts
          path: target/

      - name: List files in target (debug)
        run: ls -la target/

      - name: Run tests
        run: mvn test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: university
          DB_USER: app_user
          DB_PASSWORD: 1234

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # =========================
  # 3. РАЗВЕРТЫВАНИЕ (DEPLOY)
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Render
        run: |
          echo "Starting deployment..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "Deployment triggered"

      - name: Wait for deployment to start
        run: sleep 10

  # =========================
  # 4. HEALTHCHECK
  # =========================
  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Get deployment URL
        id: vars
        run: |
          echo "APP_URL=${{ secrets.APP_URL }}" >> $GITHUB_ENV
          echo "MAX_RETRIES=12" >> $GITHUB_ENV
          echo "RETRY_INTERVAL=10" >> $GITHUB_ENV

      - name: Health check with retry logic
        run: |
          echo "Starting healthcheck for: ${{ env.APP_URL }}"

          for i in $(seq 1 ${{ env.MAX_RETRIES }}); do
            echo "Attempt $i of ${{ env.MAX_RETRIES }}..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              ${{ env.APP_URL }}/actuator/health || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Healthcheck PASSED! Service is healthy."
              exit 0
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "Service not reachable (timeout or connection refused)"
            else
              echo "Health endpoint returned HTTP $HTTP_CODE"
            fi

            if [ $i -lt ${{ env.MAX_RETRIES }} ]; then
              echo "Retrying in ${{ env.RETRY_INTERVAL }} seconds..."
              sleep ${{ env.RETRY_INTERVAL }}
            fi
          done

          echo "Healthcheck FAILED after ${{ env.MAX_RETRIES }} attempts"
          exit 1

      - name: Verify critical endpoints
        run: |
          echo "Verifying critical endpoints..."

          MAIN_PAGE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }})
          if [ "$MAIN_PAGE" = "200" ]; then
            echo "Main page is accessible"
          else
            echo "Main page returned HTTP $MAIN_PAGE"
          fi

          if [ ! -z "${{ secrets.API_ENDPOINT }}" ]; then
            API_CHECK=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }}${{ secrets.API_ENDPOINT }})
            if [ "$API_CHECK" = "200" ]; then
              echo "API endpoint is accessible"
            else
              echo "API endpoint returned HTTP $API_CHECK"
            fi
          fi

      - name: Check database connectivity
        run: |
          DB_CHECK=$(curl -s ${{ env.APP_URL }}/actuator/health/db || echo "{\"status\":\"UNKNOWN\"}")
          if echo "$DB_CHECK" | grep -q "UP"; then
            echo "Database connection is healthy"
          else
            echo "Database health check: $DB_CHECK"
          fi

      - name: Send notification on healthcheck failure
        if: failure()
        run: |
          echo "HEALTHCHECK FAILED for ${{ secrets.APP_URL }}"
          echo "Service did not respond correctly within the timeout period"

      - name: Healthcheck summary
        if: always()
        run: |
          echo "========================================="
          echo "Healthcheck Summary"
          echo "========================================="
          echo "Build: completed"
          echo "Tests: completed"
          echo "Deploy: triggered"
          if [ ${{ job.status }} = "success" ]; then
            echo "Healthcheck: PASSED"
            echo "Application is successfully deployed and healthy!"
          else
            echo "Healthcheck: FAILED"
            echo "Please check the application logs"
          fi
          echo "========================================="