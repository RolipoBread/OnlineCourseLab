name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  # =========================
  # 1. BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build project
        run: mvn clean package -DskipTests


  # =========================
  # 2. TESTS
  # =========================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn test


  # =========================
  # 3. DOCKER BUILD
  # =========================
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t online-courses-app .


  # =========================
  # 4. DEPLOY
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy to Render via webhook
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}